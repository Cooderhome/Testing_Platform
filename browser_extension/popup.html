<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AppCritic</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-body">
  <div id="login-view">
    <h3>Login to AppCritic</h3>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button id="login-btn">Login</button>
    <div id="login-error" class="error"></div>
  </div>

  <div id="main-view" style="display: none;">
    <h3>AppCritic</h3>
    <div class="info">Logged in as <span id="user-display"></span></div>
    
    <label for="session-select">Testing Session:</label>
    <select id="session-select">
      <option value="">Select a session...</option>
    </select>
    
    <button id="start-critic-btn">Start Critic Mode</button>
    <button id="stop-critic-btn" style="display:none;" class="danger">Stop Critic Mode</button>
    <button id="logout-btn" class="secondary">Logout</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
